defaults:
  - data: hkfd_dec2025_hx2_mu_fc
  - model: resnet50_hkfd
  - engine: regression
  - tasks/restore_state: restore_state
  - tasks/evaluate: test
  - override loss@tasks.evaluate.loss: multi_target
  - _self_

gpu_list: [0]            # farnarkle P100 nodes have 2
seed: 1337
dump_path: './outputs/'
amp: false                  # P100: no bf16, and fp16 overflows in eval mode

engine:
  channels_last: false      # NHWC kernels target Tensor Cores; Pascal has none
  target_key:
    - neutrino_energy
    - energies
    - positions
    - directions
  target_scale_factor:
    neutrino_energy: 2000
    energies: 2000
    positions: 1750
    directions: 1

model:
  num_output_channels: 8