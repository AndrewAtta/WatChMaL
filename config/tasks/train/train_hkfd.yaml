defaults:
  - /optimizers: adamW2D
  - /scheduler: cosinelr
  - /loss: huber_hkfd
  - /data_loaders:
    - train
    - validation
scheduler:
  eta_min: 1.0e-06
data_loaders:
  train:
    batch_size: 256
    pre_transforms: null
  validation:
    batch_size: 256
num_val_batches: 690
val_interval: 2000
epochs: 6
checkpointing: false
