defaults:
  - data: hkfd_dec2025_hx2_mu_fc
  - model: resnet50_hkfd
  - engine: regression
  - tasks/train: train_hkfd
  - tasks/restore_best_state: restore_best_state
  - tasks/evaluate: test
  - override loss@tasks.train.loss: multi_target
  - override loss@tasks.evaluate.loss: multi_target
  - override optimizers@tasks.train.optimizers: adamW2D
  - _self_

gpu_list: [0, 1, 2, 3]      # milan A100 node
seed: 1337
dump_path: './outputs/'
amp: true                   # A100 has bf16; its fp32 exponent range avoids the
                            # eval-mode overflow that forced fp32 on the P100s

engine:
  channels_last: true       # NHWC feeds A100 Tensor Cores
  target_key:
    - neutrino_energy
    - energies
    - positions
    - directions
  target_scale_factor:
    neutrino_energy: 2000
    energies: 2000
    positions: 1750         # = position RMS, so scaled targets are ~unit variance
    directions: 1

model:
  num_output_channels: 8

tasks:
  train:
    optimizers:
      lr: 0.01             
      weight_decay: 0.005
    loss:
      deltas: [0.1, 0.05, 1.0, 1.0]
    scheduler:
      T_max: 31180          # 1559 iterations/epoch x 20; scheduler steps per iteration
    data_loaders:
      train:
        batch_size: 512
        num_workers: 6
      validation:
        batch_size: 512
        num_workers: 6
    epochs: 20
    val_interval: 500       # 62 validations over the run
    num_val_batches: 194    # full validation pass at batch 512 on 4 GPUs
    report_interval: 50     # only 31,180 iterations total, so 200 is coarse
    save_interval: 1
  evaluate:
    loss:
      deltas: [0.1, 0.05, 1.0, 1.0]
    data_loaders:
      test:
        batch_size: 512
        num_workers: 6
